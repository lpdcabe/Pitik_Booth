services:
  - type: web
    name: pitik-booth-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev --workspace=backend --include-workspace-root=false
    startCommand: node backend/src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PHOTO_RETENTION_DAYS
        value: "7"
